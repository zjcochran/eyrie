# Eyrie with SQLite, its database and secret key in the eyrie-data volume.
services:
  eyrie:
    image: ghcr.io/zjcochran/eyrie:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Etc/UTC
    volumes:
      - eyrie-data:/data
      - /var/run/docker.sock:/var/run/docker.sock # for Docker container monitors

volumes:
  eyrie-data:
